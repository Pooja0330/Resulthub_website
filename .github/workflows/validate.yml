name: Validate GoResultHub changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "checker/**"
      - "site/app.js"
      - "site/live-alerts.js"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install checker dependencies
        run: python -m pip install requests certifi urllib3 beautifulsoup4 feedparser

      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/state.js
          node --check site/live-alerts.js

      - name: Run offline regression tests
        run: python -m unittest discover -s checker -p "test_*.py" -v
