name: Update official exam links
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-exam-monitor
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official source links
        run: python scripts/monitor_official.py
      - name: Publish changed results
        run: |
          if git diff --quiet -- site/data/results.json; then
            echo "No new links"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/results.json
          git commit -m "Auto-update official exam links"
          git push
