name: Update PIB News

on:
  workflow_dispatch:
  schedule:
    # Independent of the exam scanner so PIB refreshes even when exam portals time out.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "checker/update_pib.py"
      - ".github/workflows/update-pib-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goresult-hub-pib-updater
  cancel-in-progress: false

jobs:
  update-pib:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PIB feed dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 feedparser
      - name: Fetch official PIB releases
        run: python checker/update_pib.py
      - name: Commit PIB feed if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/pib-news.json
          if git diff --cached --quiet; then
            echo "PIB feed unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh official PIB news feed"
          # Exam scans and the PIB updater can finish at nearly the same time.
          # Retry after fetching/rebasing instead of failing on a concurrent push.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent repository update; retrying push ($attempt/3)"
            git rebase --abort || true
            sleep 2
          done
          echo "Could not push PIB data after three attempts"
          exit 1

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload updated website
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy updated PIB feed
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
