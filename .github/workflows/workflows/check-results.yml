name: check-results

on:
  # Run at minute 17 and 47 to avoid the busiest top-of-hour window.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Publish detected links to website and Telegram? Use review mode unless tested."
        required: false
        type: choice
        options:
          - review
          - auto
        default: review

permissions:
  contents: write

concurrency:
  group: result-checker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Run official-source checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          # Scheduled runs respect the repository variable. Manual run can explicitly choose review/auto.
          AUTO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'auto' && '1' || vars.AUTO_PUBLISH || '0' }}
        run: python checker/check.py

      - name: Commit state/results only when changed
        run: |
          git config user.name "resulthub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add checker/state.json site/results.json
          if git diff --cached --quiet; then
            echo "No state or result changes to commit."
          else
            git commit -m "chore: update result checker state"
            git push
          fi
