
name: Check Exam Results

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: goresult-hub-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 feedparser

      - name: Run exam checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SOURCE_TIMEOUT_SECONDS: "6"
          SOURCE_WORKERS: "8"
          MAX_NEW_PER_SOURCE: "5"
        run: python checker/check.py

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add checker/state.json
          git add checker/approved.json
          git add site/data/results.json

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Update exam notification data"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
