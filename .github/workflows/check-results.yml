
name: Check Exam Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "checker/check.py"
      - "checker/test_check.py"
      - "checker/sources.json"
      - ".github/workflows/check-results.yml"
  schedule:
    # Run every 5 minutes, offset from minute 0 to reduce contention at common cron boundaries.
    # GitHub Actions supports a minimum scheduled interval of 5 minutes.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: goresult-hub-data-writers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests certifi urllib3 beautifulsoup4 feedparser

      - name: Verify Telegram bot and channel configuration
        # Telegram API/network hiccups must not prevent publishing website data.
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ.get("TG_TOKEN", "").strip()
          admin = os.environ.get("TG_ADMIN", "").strip()
          channel = os.environ.get("TG_CHANNEL", "").strip()
          if not token:
              raise SystemExit("Telegram configuration error: TG_TOKEN secret is missing.")
          if not admin:
              print("WARNING: TG_ADMIN secret is missing; private diagnostic summaries cannot be sent.")
          if not channel:
              raise SystemExit("Telegram configuration error: TG_CHANNEL secret is missing; public alerts cannot be sent.")

          base = "https://api.telegram.org/bot" + token + "/"
          def call(method, payload=None):
              data = json.dumps(payload or {}).encode("utf-8") if payload is not None else None
              req = Request(base + method, data=data, headers={"Content-Type": "application/json"})
              try:
                  with urlopen(req, timeout=15) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  try:
                      result = json.loads(exc.read().decode("utf-8"))
                      detail = result.get("description", "Telegram API HTTP error")
                  except Exception:
                      detail = "Telegram API HTTP error " + str(exc.code)
                  raise SystemExit(method + " failed: " + detail)
              except (URLError, TimeoutError) as exc:
                  # Telegram can be temporarily unreachable from GitHub-hosted runners.
                  # Keep scanning/publishing the website feed even during a Telegram outage.
                  print("WARNING: " + method + " network failure: " + type(exc).__name__ +
                        "; continuing with website scanning. Telegram delivery may be delayed.")
                  raise SystemExit(0)
              if not result.get("ok"):
                  raise SystemExit(method + " failed: " + str(result.get("description", "Unknown Telegram API error")))
              return result["result"]

          bot = call("getMe")
          chat = call("getChat", {"chat_id": channel})
          member = call("getChatMember", {"chat_id": channel, "user_id": bot["id"]})
          if member.get("status") not in ("administrator", "creator"):
              raise SystemExit("Telegram permission error: bot is not an administrator of the configured channel.")
          if member.get("status") == "administrator" and member.get("can_post_messages") is False:
              raise SystemExit("Telegram permission error: bot administrator cannot post messages in the channel.")
          print("Telegram preflight passed: bot @" + bot.get("username", "unknown") +
                " can access channel " + str(chat.get("title") or chat.get("username") or channel) +
                " and is allowed to post. Token and chat IDs were not printed.")
          PY

      - name: Run offline checker regression tests
        run: python -m unittest discover -s checker -p "test_*.py" -v

      - name: Run exam checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SOURCE_TIMEOUT_SECONDS: "8"
          SOURCE_WORKERS: "24"
          MAX_NEW_PER_SOURCE: "5"
          MAX_PUBLIC_ALERTS_PER_RUN: "10"
        run: python checker/check.py

      - name: Validate generated website data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse

          results = json.loads(Path("site/data/results.json").read_text(encoding="utf-8"))
          status = json.loads(Path("site/data/status.json").read_text(encoding="utf-8"))
          if not isinstance(results, list):
              raise SystemExit("results.json must contain a JSON array")
          seen_ids, seen_urls = set(), set()
          for index, item in enumerate(results):
              if not isinstance(item, dict) or not str(item.get("title", "")).strip():
                  raise SystemExit(f"Invalid or title-less result at index {index}")
              url = str(item.get("url") or item.get("official_url") or "").strip()
              parsed = urlparse(url)
              if parsed.scheme != "https" or not parsed.hostname:
                  raise SystemExit(f"Invalid HTTPS notice URL at index {index}")
              item_id = str(item.get("id", "")).strip()
              if not item_id or item_id in seen_ids:
                  raise SystemExit(f"Missing or duplicate result id at index {index}")
              seen_ids.add(item_id)
              host = parsed.hostname.lower()
              if host.startswith("www."):
                  host = host[4:]
              path = parsed.path.rstrip("/") or "/"
              tracking = {"fbclid", "gclid", "dclid", "msclkid", "yclid", "ref_src"}
              query = sorted((k, v) for k, v in parse_qsl(parsed.query, keep_blank_values=True)
                             if not k.lower().startswith("utm_") and k.lower() not in tracking)
              normalized = urlunparse(("https", host, path, "", urlencode(query), ""))
              if normalized in seen_urls:
                  raise SystemExit(f"Duplicate normalized notice URL: {normalized}")
              seen_urls.add(normalized)
          enabled = int(status.get("sources_enabled", -1))
          succeeded = int(status.get("sources_succeeded", -1))
          failed = int(status.get("sources_failed", -1))
          if enabled < 1 or succeeded < 0 or failed < 0 or succeeded + failed != enabled:
              raise SystemExit("Source health counts are inconsistent in status.json")
          print(f"Validated {len(results)} results; {enabled} sources accounted for ({succeeded} reachable, {failed} failed).")
          PY

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add checker/state.json
          git add checker/approved.json
          git add site/data/results.json
          git add site/data/status.json

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Update exam notification data"

          # Shared concurrency prevents the PIB updater from pushing at the same time.
          # Retry if a manual repository change still races this commit.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase --abort >/dev/null 2>&1 || true
            if ! git rebase -X theirs origin/main; then
              echo "Rebase failed on attempt $attempt; retrying from the latest main."
              git rebase --abort >/dev/null 2>&1 || true
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update; retrying push ($attempt/5)"
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          echo "Could not push exam data after five attempts"
          exit 1

      - name: Notify admin if the checker workflow fails
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("TG_TOKEN", "").strip()
          admin = os.environ.get("TG_ADMIN", "").strip()
          if not token or not admin:
              print("Failure notification skipped: TG_TOKEN or TG_ADMIN is not configured.")
              raise SystemExit(0)
          payload = {
              "chat_id": admin,
              "text": "⚠️ GoResultHub checker workflow failed. Review the run logs: " + os.environ.get("RUN_URL", ""),
              "disable_web_page_preview": True,
          }
          request = Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=10) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"):
                      print("Telegram failure notification was not accepted.")
          except Exception as exc:
              print("Could not send checker failure notification:", type(exc).__name__)
          PY
