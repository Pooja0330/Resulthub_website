name: Check Exam Results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose review or auto mode"
        required: true
        default: review
        type: choice
        options:
          - review
          - auto
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: check-results
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install feedparser

      - name: Run result checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '0' }}
          MAX_NEW_PER_SOURCE: "5"
          SOURCE_TIMEOUT_SECONDS: "12"
          SOURCE_WORKERS: "4"
        run: python checker/check.py

      - name: Commit updated checker state, results, and approval queue
        if: success()
        run: |
          if git diff --quiet -- checker/state.json site/data/results.json checker/approved.json; then
            echo "No checker state, results, or approval queue changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Sync with newer commits from other workflows before committing.
            git stash push --include-untracked -m "checker-generated changes"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git stash pop
            git add checker/state.json site/data/results.json checker/approved.json
            git commit -m "Update checker state, results, and approval queue"
            git push
          fi
