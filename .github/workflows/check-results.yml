
name: Check Exam Results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose review or auto mode"
        required: true
        default: review
        type: choice
        options:
          - review
          - auto
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: check-results
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install feedparser

     
      # - name: Test channel posting
      #   env:
      #     TG_TOKEN: ${{ secrets.TG_TOKEN }}
      #     TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
      #   run: |
      #     python - <<'PY'
      #     import os
      #     import requests

      #     token = os.environ["TG_TOKEN"].strip()
      #     channel = os.environ["TG_CHANNEL"].strip()

      #     response = requests.post(
      #         f"https://api.telegram.org/bot{token}/sendMessage",
      #         json={
      #             "chat_id": channel,
      #             "text": "GoResultHub channel test: posting is working."
      #         },
      #         timeout=20
      #     )

      #     print("HTTP status:", response.status_code)
      #     result = response.json()
      #     print("Telegram ok:", result.get("ok"))
      #     if not result.get("ok"):
      #         print("Telegram error:", result.get("description"))
      #         raise SystemExit(1)
      #     PY

      - name: Run result checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '0' }}
          MAX_NEW_PER_SOURCE: "5"
        run: python checker/check.py

      
     
      - name: Commit updated checker state
        if: success()
        run: |
          if git diff --quiet -- checker/state.json site/data/results.json; then
            echo "No state or results changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add checker/state.json site/data/results.json
            git commit -m "Update checker state and results"
            git push
          fi

