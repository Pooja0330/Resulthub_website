
name: Check Exam Results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - review
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: check-results
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install feedparser

      - name: Run official exam checker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '0' }}
          SOURCE_TIMEOUT_SECONDS: "15"
          SOURCE_WORKERS: "3"
          MAX_NEW_PER_SOURCE: "5"
        run: python checker/check.py

      - name: Commit checker data safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add checker/state.json checker/approved.json site/data/results.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update exam checker data"

          # Rebase the generated commit on the latest main.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
