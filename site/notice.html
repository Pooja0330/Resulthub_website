<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c75"><title>Exam update | GoResultHub</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css">
<style>
.nd-wrap{max-width:960px;margin:32px auto 56px;padding:0 18px}.nd-crumb{color:#687b94;font-size:.88rem;margin:0 0 16px}.nd-card,.nd-side{background:#fff;border:1px solid #dce6f2;border-radius:19px;box-shadow:0 10px 28px #153b6b0b}.nd-card{padding:clamp(22px,4vw,42px)}.nd-kicker{color:#2c67a9;font-size:.75rem;font-weight:900;letter-spacing:.12em}.nd-card h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.15;color:#17345b;margin:12px 0}.nd-summary{font-size:1.04rem;line-height:1.75;color:#536780}.nd-meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.nd-chip{background:#f2f7ff;border:1px solid #dce7f5;border-radius:999px;padding:7px 11px;font-size:.8rem;color:#214e87;font-weight:750}.nd-status{background:#f5f8fc;border:1px solid #e0e8f2;border-radius:12px;padding:14px;color:#4d617a;line-height:1.7}.nd-actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.nd-actions a{display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:11px;font-weight:850;text-decoration:none}.nd-primary{background:#174f9c;color:#fff!important}.nd-secondary{background:#edf4ff;color:#174f9c;border:1px solid #d6e5fb}.nd-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.nd-side{padding:22px}.nd-side h2,.nd-section h2{font-size:1.15rem;color:#17345b;margin:0 0 12px}.nd-section{margin-top:24px;padding-top:22px;border-top:1px solid #e2eaf4}.nd-steps{padding-left:22px;color:#536780;line-height:1.75}.nd-muted{font-size:.86rem;line-height:1.65;color:#6b7b90}.nd-loading{padding:35px;text-align:center;color:#61748c}@media(max-width:700px){.nd-grid{grid-template-columns:1fr}.nd-wrap{margin-top:18px}}
</style></head><body>
<header class="top"><a class="brand" href="./"><span class="logo">GR</span><span>GoResultHub<small>Exam updates with links to official websites</small></span></a><nav><a href="./#updates">Latest updates</a><a href="./#find-exams">Find exams</a></nav></header>
<main class="nd-wrap"><p class="nd-crumb"><a href="./">Home</a> / <a href="./#updates">Exam updates</a> / Details</p><div id="detail" class="nd-loading" aria-live="polite">Loading update details…</div></main>
<footer><div><a class="brand footbrand" href="./"><span class="logo">GR</span><span>GoResultHub<small>Exam updates with links to official websites</small></span></a><p>Exam updates and links to issuing authorities.</p></div><div class="footlinks"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="disclaimer.html">Disclaimer</a></div><p class="copyright">© GoResultHub</p></footer>
<script>
(()=>{"use strict";
const p=new URLSearchParams(location.search),id=p.get("id")||"",q=p.get("q")||"",box=document.getElementById("detail");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>{try{const u=new URL(s);return u.protocol==="https:"?u.href:""}catch(e){return""}};
const fmt=s=>{if(!s)return"Not provided";const d=new Date(s);return isNaN(d)?"Not provided":new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Kolkata"}).format(d)+" IST"};
const label=s=>String(s||"Exam update").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function draw(x){
 const title=x?.title||x?.exam||q||"Exam update",authority=x?.source_name||x?.authority||"Issuing authority";
 const url=safe(x?.url||x?.official_url),portal=safe(x?.source_url);
 const login=url&&/(login|candidate-login|score.?display|result.?status)/i.test(new URL(url).pathname);
 document.title=title+" | GoResultHub";box.className="";
 box.innerHTML='<article class="nd-card"><p class="nd-kicker">GORESULTHUB · EXAM UPDATE</p><h1>'+esc(title)+'</h1><p class="nd-summary">'+esc(x?.description||"This listing links to an issuing authority. Open the official notice to confirm the exact dates, eligibility and instructions.")+'</p><div class="nd-meta"><span class="nd-chip">'+esc(label(x?.category))+'</span><span class="nd-chip">'+esc(authority)+'</span><span class="nd-chip">'+esc(x?.state||x?.region||"All India")+'</span></div><div class="nd-status"><b>Listing status:</b> Indexed by GoResultHub; confirm current availability on the authority website.<br><b>Detected by GoResultHub:</b> '+esc(fmt(x?.detected_at))+'<br><b>Publication date:</b> '+esc(x?.published?fmt(x.published):"Not separately shown by source")+'</div><div class="nd-actions">'+(url?'<a class="nd-primary" href="'+esc(url)+'" target="_self">'+(login?"Open official result / candidate login ↗":"Open official notice / result ↗")+'</a>':"")+(portal?'<a class="nd-secondary" href="'+esc(portal)+'" target="_self">Visit authority website ↗</a>':"")+'<a class="nd-secondary" href="./?q='+encodeURIComponent(title)+'#updates">More updates for this exam</a></div><section class="nd-section"><h2>How to check</h2><ol class="nd-steps"><li>Open the official notice or result link above.</li><li>Verify the exam name, year, dates and instructions on the issuing authority’s website.</li><li>If a candidate login is required, enter registration/roll number and credentials only on the official domain.</li><li>Download or print your notice/scorecard from the authority portal if it is available.</li></ol></section><p class="nd-muted">GoResultHub is an independent information directory and is not affiliated with any government, board, university or recruitment authority. Detection time means when GoResultHub indexed the listing, not necessarily when the authority published it. We do not host candidate marksheets or collect exam passwords or CAPTCHA answers.</p></article><div class="nd-grid"><section class="nd-side"><h2>Official links</h2>'+(url?'<p><a href="'+esc(url)+'" target="_self">'+(login?"Open official candidate login ↗":"Open official notice/result ↗")+'</a></p>':"<p>Direct official link is not available in this listing.</p>")+(portal?'<p><a href="'+esc(portal)+'" target="_self">Authority homepage / notices ↗</a></p>':"")+'</section><aside class="nd-side"><h2>Before you proceed</h2><p class="nd-muted">Some results require a candidate login and may be available only for a limited period. GoResultHub does not guarantee a detected notice is still active.</p><a href="disclaimer.html">Read our disclaimer</a></aside></div>';
}
(async()=>{try{const r=await fetch("data/results.json",{cache:"no-cache"});if(!r.ok)throw Error("feed unavailable");const data=await r.json();let x=data.find(v=>String(v.id||"")===id);if(!x&&q)x=data.find(v=>String(v.title||v.exam||"").toLowerCase()===q.toLowerCase());if(x){draw(x);return}box.className="";box.innerHTML='<article class="nd-card"><p class="nd-kicker">GORESULTHUB · EXAM INFORMATION</p><h1>'+esc(q||"Exam update")+'</h1><p class="nd-summary">This specific item is not currently in GoResultHub’s indexed feed. Search the latest updates or browse the exam directory for an authority link.</p><div class="nd-actions"><a class="nd-primary" href="./?q='+encodeURIComponent(q)+'#updates">Search GoResultHub</a><a class="nd-secondary" href="./#find-exams">Browse exam directory</a></div><p class="nd-muted">We do not invent result statuses or copy third-party articles. Candidate-specific results must be checked on the issuing authority’s portal.</p></article>'}catch(e){box.className="";box.innerHTML='<article class="nd-card"><h1>'+esc(q||"Exam update")+'</h1><p>Update details could not be loaded. Please try again.</p><a href="./?q='+encodeURIComponent(q)+'#updates">Back to GoResultHub</a></article>'}})();
})();
</script><script src="live-alerts.js" defer></script><script src="cookie-consent.js" defer></script>
<script src="language.js" defer></script>
</body></html>
